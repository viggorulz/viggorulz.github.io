<!DOCTYPE html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QvalitetsBygg</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.1/dist/tailwind.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;500&display=swap" rel="stylesheet">
    <style>
      html { scroll-behavior: smooth; }
      body { font-family: 'Montserrat', sans-serif; }
      .menu-open { transform: translateX(0); }
      .mobile-menu { transition: transform 0.3s cubic-bezier(.4,0,.2,1);}
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <!-- Navigation -->
    <nav class="fixed w-full z-30 bg-white shadow-sm">
      <div class="max-w-7xl mx-auto px-4 flex justify-between items-center h-16">
        <a href="#/start" class="flex items-center gap-2">
          <span class="text-blue-600 font-extrabold text-2xl tracking-tight uppercase">Qvalitets</span>
          <span class="text-gray-900 font-extrabold text-2xl uppercase">Bygg</span>
        </a>
        <div class="hidden md:flex gap-8 items-center font-semibold">
          <a href="#/start" class="hover:text-blue-600 transition">Start</a>
          <a href="#/tjanster" class="hover:text-blue-600 transition">Tjänster</a>
          <a href="#/om-oss" class="hover:text-blue-600 transition">Om oss</a>
          <a href="#/referenser" class="hover:text-blue-600 transition">Referenser</a>
          <a href="#/kontakt" class="hover:bg-blue-600 hover:text-white px-4 py-1 rounded transition border border-blue-600 text-blue-600">Kontakt</a>
        </div>
        <button id="menu-btn" class="md:hidden focus:outline-none" aria-label="Öppna meny">
          <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
      <!-- Mobilmeny -->
      <div id="mobile-menu" class="mobile-menu fixed top-0 right-0 h-full w-64 bg-white shadow-2xl z-40 transform translate-x-full flex flex-col p-6 gap-6 md:hidden">
        <button id="close-menu" class="self-end mb-2" aria-label="Stäng meny">
          <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
        <a href="#/start" class="text-lg font-semibold hover:text-blue-600" onclick="closeMenu()">Start</a>
        <a href="#/tjanster" class="text-lg font-semibold hover:text-blue-600" onclick="closeMenu()">Tjänster</a>
        <a href="#/om-oss" class="text-lg font-semibold hover:text-blue-600" onclick="closeMenu()">Om oss</a>
        <a href="#/referenser" class="text-lg font-semibold hover:text-blue-600" onclick="closeMenu()">Referenser</a>
        <a href="#/kontakt" class="text-lg font-semibold hover:bg-blue-600 hover:text-white px-4 py-2 rounded border border-blue-600 text-blue-600 mt-2 text-center" onclick="closeMenu()">Kontakt</a>
      </div>
      <div id="menu-backdrop" class="hidden fixed inset-0 bg-black bg-opacity-40 z-30 md:hidden"></div>
    </nav>

    <!-- SIDINNEHÅLL -->
    <main id="app" class="pt-20"></main>
    
    <footer class="text-center pb-6 pt-16 bg-gray-50 text-gray-600">
      © 2024 QvalitetsBygg AB &bull; Kvalitet i varje steg
    </footer>
    
    <!-- Sidor/sektioner templates -->
    <template id="start-template">
      <section class="relative min-h-[50vh] bg-blue-700 overflow-hidden flex flex-col md:flex-row items-center justify-between px-6 py-14 lg:py-24 gap-10 rounded-b-3xl shadow-lg">
        <div class="flex-1 z-10">
          <h1 class="text-white text-4xl md:text-5xl font-extrabold mb-6 drop-shadow-lg tracking-tight">
            Byggdrömmar med <span class="text-yellow-300">Kvalitet</span>
          </h1>
          <p class="text-blue-100 text-lg mb-8 max-w-xl">
            Ditt pålitliga byggföretag för allt från renovering till nyproduktion – alltid med fokus på hållbarhet, säkerhet och yrkesskicklighet.
          </p>
          <a href="#/kontakt" class="inline-block bg-yellow-300 text-blue-700 font-bold text-lg px-8 py-3 rounded shadow hover:bg-yellow-400 transition">
            Få kostnadsfri offert
          </a>
        </div>
        <div class="flex-1 flex items-end justify-center z-0">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=700&q=80"
               class="w-80 h-80 object-cover rounded-xl shadow-2xl border-4 border-white ring-4 ring-blue-400"
               alt="Byggarbetare" />
        </div>
        <!-- Dekorativa former -->
        <div class="absolute -top-20 -left-24 w-96 h-96 bg-yellow-300 opacity-20 rounded-full blur-3xl z-0"></div>
      </section>
      <!-- Tjänster -->
      <section class="max-w-7xl mx-auto p-8 grid gap-10 md:grid-cols-3 mt-16">
        <div class="bg-white shadow-lg rounded-xl p-8 border-b-4 border-yellow-300 hover:-translate-y-1 transition transform hover:shadow-2xl">
          <div class="flex items-center mb-4">
            <svg class="w-9 h-9 text-blue-600 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 17v-6a2 2 0 012-2h2V7a5 5 0 0110 0v2h2a2 2 0 012 2v6M16 21v-4M8 21v-4m-4 4h16"/></svg>
            <h3 class="font-bold text-xl">Renovering</h3>
          </div>
          <p class="text-gray-600">Vi hjälper dig att förvandla ditt hem eller lokal genom allt från köksrenoveringar till totalombyggnader.</p>
        </div>
        <div class="bg-white shadow-lg rounded-xl p-8 border-b-4 border-blue-600 hover:-translate-y-1 transition transform hover:shadow-2xl">
          <div class="flex items-center mb-4">
            <svg class="w-9 h-9 text-yellow-400 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21V7.2A2.2 2.2 0 0017.8 5H6.2A2.2 2.2 0 004 7.2V21m16 0H4"/></svg>
            <h3 class="font-bold text-xl">Nyproduktion</h3>
          </div>
          <p class="text-gray-600">Från planering till färdigt hus – vi bygger nytt med moderna metoder och kvalitetsmaterial.</p>
        </div>
        <div class="bg-white shadow-lg rounded-xl p-8 border-b-4 border-gray-600 hover:-translate-y-1 transition transform hover:shadow-2xl">
          <div class="flex items-center mb-4">
            <svg class="w-9 h-9 text-green-500 mr-2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 17l4-4 4 4M12 21V11"/></svg>
            <h3 class="font-bold text-xl">Fastighetsservice</h3>
          </div>
          <p class="text-gray-600">Regelbunden fastighetsskötsel för BRF eller företag – vi tar ansvar för kvalitet och skötsel.</p>
        </div>
      </section>
      <!-- Om oss preview -->
      <section class="max-w-4xl mx-auto mt-24 px-6 text-center">
        <h2 class="text-3xl font-bold text-blue-700 mb-4">Byggkompetens sedan 2005</h2>
        <p class="text-gray-700 mb-6">Med erfarenhet från hundratals projekt och ett hängivet team levererar QvalitetsBygg kvalitet och trygghet. Våra medarbetare är certifierade och arbetar med både mindre och större byggåtaganden runtom i Sverige.</p>
        <a href="#/om-oss" class="text-blue-600 font-semibold hover:underline">Läs mer om oss →</a>
      </section>
      <!-- Referenser preview -->
      <section class="max-w-6xl mx-auto mt-24 grid md:grid-cols-3 gap-8 px-6">
        <div class="bg-white rounded-xl shadow p-6 border-l-4 border-blue-600">
          <blockquote class="italic mb-3">"Otroligt proffsiga och noggranna. Vi är supernöjda med vårt nya kök!"</blockquote>
          <div class="flex items-center gap-2">
            <span class="font-bold">Anna S.</span>
            <span class="text-gray-400 text-sm">Stockholm</span>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow p-6 border-l-4 border-yellow-400">
          <blockquote class="italic mb-3">"Projektet höll både tidplan och budget. Rekommenderar varmt!"</blockquote>
          <div class="flex items-center gap-2">
            <span class="font-bold">Jonas B.</span>
            <span class="text-gray-400 text-sm">Malmö</span>
          </div>
        </div>
        <div class="bg-white rounded-xl shadow p-6 border-l-4 border-gray-600">
          <blockquote class="italic mb-3">"Snabb service och hög kvalitet. Kommer anlita igen."</blockquote>
          <div class="flex items-center gap-2">
            <span class="font-bold">Sofia L.</span>
            <span class="text-gray-400 text-sm">Uppsala</span>
          </div>
        </div>
      </section>
      <!-- Kontakt-preview -->
      <section class="max-w-xl mx-auto mt-24 mb-20 px-6 text-center">
        <h2 class="text-2xl font-semibold text-blue-700 mb-4">Redo att starta ditt projekt?</h2>
        <p class="mb-5 text-gray-800">Kontakta oss för gratis offert och rådgivning!</p>
        <a href="#/kontakt" class="bg-blue-700 text-white font-bold px-6 py-3 rounded hover:bg-blue-800 shadow inline-block transition">Kontakta oss</a>
      </section>
    </template>

    <template id="tjanster-template">
      <section class="max-w-4xl mx-auto mt-16 px-6">
        <h2 class="text-3xl md:text-4xl font-bold text-blue-700 mb-8">Våra tjänster</h2>
        <ul class="grid md:grid-cols-2 gap-10">
          <li class="bg-white shadow rounded-xl p-8 border-b-4 border-yellow-300 hover:shadow-lg transition">
              <h3 class="font-bold text-xl mb-2">Renovering</h3>
              <p class="text-gray-700 mb-2">Vi sköter allt från badrums- och köksrenovering till tillbyggnad och helrenovering av bostäder och kommersiella fastigheter.</p>
          </li>
          <li class="bg-white shadow rounded-xl p-8 border-b-4 border-blue-600 hover:shadow-lg transition">
            <h3 class="font-bold text-xl mb-2">Nyproduktion</h3>
            <p class="text-gray-700 mb-2">Vi bygger nytt! Allt från villor, rad- och parhus till moduler och företagsetableringar.</p>
          </li>
          <li class="bg-white shadow rounded-xl p-8 border-b-4 border-green-500 hover:shadow-lg transition">
            <h3 class="font-bold text-xl mb-2">Fastighetsservice</h3>
            <p class="text-gray-700 mb-2">Felanmälan, underhåll och jour – vi sköter kontinuerlig service för BRFer, företag och fastighetsägare.</p>
          </li>
          <li class="bg-white shadow rounded-xl p-8 border-b-4 border-gray-600 hover:shadow-lg transition">
            <h3 class="font-bold text-xl mb-2">Projektledning</h3>
            <p class="text-gray-700">Vi erbjuder komplett projektledning för såväl små som stora byggprojekt – från idé till inflytt!</p>
          </li>
        </ul>
      </section>
    </template>

    <template id="om-oss-template">
      <section class="max-w-3xl mx-auto mt-16 px-6 text-center">
        <h2 class="text-3xl md:text-4xl font-bold text-blue-700 mb-6">Om QvalitetsBygg</h2>
        <p class="text-gray-800 mb-4">
          QvalitetsBygg grundades 2005 och har växt till ett av Mellansveriges mest välrenommerade byggföretag. Vårt team består av erfarna hantverkare, projektledare och serviceinriktade rådgivare.
        </p>
        <p class="text-gray-700 mb-8">
          Vi värdesätter hållbarhet, kundnöjdhet och tydlighet i varje byggprojekt. Genom att kombinera traditionellt hantverk med moderna lösningar skapar vi trygga miljöer för våra kunder.
        </p>
        <div class="flex flex-col md:flex-row gap-8 justify-center mt-8">
          <div class="flex-1 bg-blue-50 rounded-xl p-6 shadow text-left">
            <h3 class="text-blue-700 font-bold text-xl mb-2">+550</h3>
            <p class="text-gray-700">Genomförda projekt</p>
          </div>
          <div class="flex-1 bg-yellow-50 rounded-xl p-6 shadow text-left">
            <h3 class="text-yellow-500 font-bold text-xl mb-2">19</h3>
            <p class="text-gray-700">År av erfarenhet</p>
          </div>
        </div>
        <img src="https://images.unsplash.com/photo-1523540939398-c1c1818eece7?auto=format&fit=crop&w=700&q=80"
             alt="Qvalitetsbygg team" class="mx-auto mt-12 rounded-xl shadow-lg w-full md:w-3/4 object-cover" />
      </section>
    </template>

    <template id="referenser-template">
      <section class="max-w-5xl mx-auto mt-16 px-6">
        <h2 class="text-3xl md:text-4xl font-bold text-blue-700 mb-10">Kundreferenser</h2>
        <div class="grid md:grid-cols-2 gap-8">
          <div class="bg-white shadow rounded-xl p-8 border-b-4 border-blue-600 transition hover:shadow-lg">
            <blockquote class="italic text-gray-800 mb-4">
              "QvalitetsBygg tog totalansvar för vår kontorsrenovering. Resultatet blev bättre än vi kunnat önska – tack!"
            </blockquote>
            <div class="flex gap-2 font-semibold text-blue-700">
              <span>Anders L.</span> · <span>Västerås</span>
            </div>
          </div>
          <div class="bg-white shadow rounded-xl p-8 border-b-4 border-yellow-300 transition hover:shadow-lg">
            <blockquote class="italic text-gray-800 mb-4">
              "Allt från start till mål gick smidigt. Snyggt, hållbart och trevlig personal."
            </blockquote>
            <div class="flex gap-2 font-semibold text-yellow-500">
              <span>Lisette W.</span> · <span>Enköping</span>
            </div>
          </div>
          <div class="bg-white shadow rounded-xl p-8 border-b-4 border-green-500 transition hover:shadow-lg">
            <blockquote class="italic text-gray-800 mb-4">
              "Vi anlitade QvalitetsBygg för ombyggnad av vårt radhus. Noggrannt, punktligt och hög servicenivå."
            </blockquote>
            <div class="flex gap-2 font-semibold text-green-500">
              <span>Maria P.</span> · <span>Uppsala</span>
            </div>
          </div>
          <div class="bg-white shadow rounded-xl p-8 border-b-4 border-gray-600 transition hover:shadow-lg">
            <blockquote class="italic text-gray-800 mb-4">
              "Utmärkt kommunikation. Fick snabb hjälp med fastighetens underhåll och service."
            </blockquote>
            <div class="flex gap-2 font-semibold text-gray-600">
              <span>Fredrik G.</span> · <span>Örebro</span>
            </div>
          </div>
        </div>
      </section>
    </template>

    <template id="kontakt-template">
      <section class="max-w-2xl mx-auto mt-16 px-6 pb-24">
        <h2 class="text-3xl md:text-4xl font-bold text-blue-700 mb-2">Kontakta oss</h2>
        <p class="mb-6 text-gray-800">Vi återkommer oftast inom 24h. Fyll i formuläret, eller ring oss direkt!</p>
        <form class="bg-white shadow rounded-xl p-8 flex flex-col gap-6" autocomplete="off" onsubmit="event.preventDefault(); alert('Tack för ditt meddelande! Vi kontaktar dig snart.'); this.reset();">
          <input required type="text" placeholder="Namn" class="p-3 border rounded outline-blue-600 focus:ring-2" />
          <input required type="email" placeholder="E-post" class="p-3 border rounded outline-blue-600 focus:ring-2"/>
          <input type="tel" placeholder="Telefon (valfritt)" class="p-3 border rounded outline-blue-600 focus:ring-2"/>
          <textarea required rows="4" placeholder="Ditt ärende eller meddelande..." class="p-3 border rounded outline-blue-600 focus:ring-2"></textarea>
          <button type="submit" class="bg-blue-700 text-white font-semibold px-6 py-3 rounded hover:bg-blue-800 transition">Skicka</button>
        </form>
        <div class="mt-8 text-center text-gray-700">
          <p><b>Telefon:</b> 08-123 456 78</p>
          <p><b>E-post:</b> info@qvalitetsbygg.se</p>
        </div>
      </section>
    </template>

    <!-- JS-routing + mobilmeny -->
    <script>
      // Sidor
      const routes = {
        'start': 'start-template',
        'tjanster': 'tjanster-template',
        'om-oss': 'om-oss-template',
        'referenser': 'referenser-template',
        'kontakt': 'kontakt-template'
      };
      // Routing-funktion
      function renderPage() {
        const hash = (location.hash || '#/start').replace('#/', '');
        const page = routes[hash] ? hash : 'start';
        const tpl = document.getElementById(routes[page]);
        document.getElementById('app').innerHTML = tpl.innerHTML;
        window.scrollTo(0,0);
      }
      window.addEventListener('hashchange', renderPage);
      window.addEventListener('DOMContentLoaded', renderPage);

      // Mobilmeny
      const menuBtn = document.getElementById('menu-btn');
      const closeBtn = document.getElementById('close-menu');
      const mobileMenu = document.getElementById('mobile-menu');
      const backdrop = document.getElementById('menu-backdrop');

      function openMenu() {
        mobileMenu.classList.add('menu-open');
        backdrop.classList.remove('hidden');
        setTimeout(() => backdrop.classList.add('!bg-opacity-60'), 10);
      }
      function closeMenu() {
        mobileMenu.classList.remove('menu-open');
        backdrop.classList.add('hidden');
        backdrop.classList.remove('!bg-opacity-60');
      }
      menuBtn.addEventListener('click', openMenu);
      closeBtn.addEventListener('click', closeMenu);
      backdrop.addEventListener('click', closeMenu);
    </script>
  </body>
</html>
